{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
    <h2>My Profile</h2>

    {% if profile_user.profile_picture %}
        <img
            src="{{ profile_user.profile_picture.url }}"
            alt="Profile picture"
            width="150"
        >
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Update Profile
        </button>
    </form>
{% endblock %}
